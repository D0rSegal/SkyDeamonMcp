[project]
name = "skydeamon-mcp"
version = "0.1.0"
description = "MCP wrapper for SkyDemon (reverse-engineered login interop)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.6,<2", "httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
skydeamon-mcp = "skydeamon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skydeamon"]
